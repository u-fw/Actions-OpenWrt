name: Source validation
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths: &a1
      - .config
      - diy-*.sh
      - .github/workflows/**
  pull_request:
    paths: *a1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check custom build scripts
        run: |
          for script in diy-part1.sh diy-part2.sh; do bash -n "$script"; done
          test -s .config
          grep -q "^CONFIG_TARGET" .config
